<div id="exportModal" class="modal" style="display: none">
  <h2 class="modal-title">Export Files</h2>
  
  <form id="exportForm">
    <!-- Zone avec défilement s'il y a beaucoup de files -->
    <div class="file-selection-wrapper" style="max-height: 250px; overflow-y: auto; margin-bottom: 20px; text-align: left;">
      
      <!-- Option Sélectionner Tout -->
      <label style="display: block; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #ccc;">
        <input type="checkbox" id="selectAll" />
        <b class="mono">Select All</b>
      </label>

      <div id="fileList">
        {% for file in files %}
          <label style="display: block; margin-bottom: 5px;">
            <input type="checkbox" name="files_to_export" value="{{ file }}" class="file-checkbox" />
            <span class="mono">{{ file }}</span>
          </label>
        {% else %}
          <p class="mono" style="color: grey;">No files are available for export</p>
        {% endfor %}
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" id="closeExportModalBtn" class="btn secondary">Cancel</button>
      <button type="submit" class="btn primary">Export Selected</button>
    </div>
  </form>
  
  <div id="exportStatus" class="mono" style="margin-top: 10px;"></div>
</div>

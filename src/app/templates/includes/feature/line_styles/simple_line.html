<!-- SIMPLE LINE  -->
<span class="swatch_area_fills">
  <svg width="100" height="30">
    {% if line['style'] == 'dash' %}

    <line
      x1="0"
      y1="15"
      x2="100"
      y2="15"
      stroke="rgb({{line['color']['day']['red']}},{{line['color']['night']['green']}},{{line['color']['night']['blue']}})"
      stroke-width="{{line['thickness']}}"
      stroke-dasharray="8 5"
    />

    {% elif line['style'] == 'dot' %}
    <line
      x1="0"
      y1="15"
      x2="100"
      y2="15"
      stroke="rgb({{line['color']['night']['red']}},{{line['color']['night']['green']}},{{line['color']['night']['blue']}})"
      stroke-width="{{line['thickness']}}"
      stroke-dasharray="2 3"
    />

    {% else %}
    <line
      x1="0"
      y1="15"
      x2="100"
      y2="15"
      stroke="rgb({{line['color']['night']['red']}},{{line['color']['night']['green']}},{{line['color']['night']['blue']}})"
      stroke-width="{{line['thickness']}}"
    />
    {% endif %}
  </svg>
</span>

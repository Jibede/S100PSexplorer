<!-- SIMPLE LINE  -->  
<span class="swatch_area_fills">
  <svg width="100" height="30">
    {% if style == 'dash' %}
      <line
        x1="0"
        y1="15"
        x2="100"
        y2="15"
        stroke="rgb({{color['day']['red']}},{{color['night']['green']}},{{color['night']['blue']}})"
        stroke-width="{{thickness}}"
        stroke-dasharray="8 5"
      />

    {% elif style == 'dot' %}
      <line
        x1="0"
        y1="15"
        x2="100"
        y2="15"
        stroke="rgb({{color['night']['red']}},{{color['night']['green']}},{{color['night']['blue']}})"
        stroke-width="{{thickness}}"
        stroke-dasharray="2 3"
      />

    {% else %}
      <line
        x1="0"
        y1="15"
        x2="100"
        y2="15"
        stroke="rgb({{color['night']['red']}},{{color['night']['green']}},{{color['night']['blue']}})"
        stroke-width="{{thickness}}"
      />
      
    {% endif %}
  </svg>
</span>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Analyseur des règles d'affichage — LUA S-101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B2545;
    --navy-deep:#071B36;
    --chart:#F1ECDD;
    --chart-line:#D8CFB4;
    --teal:#2A6F77;
    --teal-soft:#DCEBEA;
    --amber:#C97C2C;
    --ink:#13202B;
    --ink-soft:#5B6B75;
    --white:#FFFFFF;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--chart);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  code, .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- TopBar (Entité 2) ---------- */
  .topbar{
    height:56px;
    background:var(--navy);
    display:flex;
    align-items:center;
    padding:0 20px;
    gap:28px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .brand{
    color:var(--white);
    font-weight:700;
    font-size:14px;
    letter-spacing:.06em;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }
  .brand .dot{width:8px;height:8px;background:var(--amber);border-radius:50%;display:inline-block;}
  .brand small{color:#9FB3C8;font-weight:500;letter-spacing:.02em;font-size:11px;}
  nav.topnav{display:flex;gap:4px;margin-left:auto;}
  nav.topnav button{
    background:transparent;
    border:none;
    color:#B9C7D6;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:.03em;
    padding:8px 16px;
    cursor:pointer;
    border-radius:var(--radius);
    transition:background .15s, color .15s;
  }
  nav.topnav button:hover{color:var(--white); background:rgba(255,255,255,.06);}
  nav.topnav button.active{color:var(--navy); background:var(--amber);}

  /* ---------- Layout shell ---------- */
  .shell{display:flex; min-height:calc(100vh - 56px);}

  /* ---------- Sidebar (Entité 1) ---------- */
  .sidebar{
    width:250px;
    flex-shrink:0;
    background:var(--navy-deep);
    color:#E6EBF0;
    padding:16px 14px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .sidebar .label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:#7C90A3;
    font-weight:600;
    margin-top:6px;
  }
  .sidebar input[type=text]{
    background:#0F2C4E;
    border:1px solid #1E3E63;
    color:var(--white);
    font-family:inherit;
    font-size:13px;
    padding:8px 10px;
    border-radius:var(--radius);
    outline:none;
  }
  .sidebar input[type=text]::placeholder{color:#6E86A0;}
  .sidebar input[type=text]:focus{border-color:var(--amber);}
  .side-list{list-style:none; margin:0; padding:0; overflow-y:auto; display:flex; flex-direction:column; gap:2px;}
  .side-list li{
    padding:8px 10px;
    font-size:13px;
    border-radius:var(--radius);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    gap:6px;
    align-items:baseline;
  }
  .side-list li:hover{background:#12335A;}
  .side-list li.active{background:var(--teal); color:var(--white);}
  .side-list li .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8CA4BB;}
  .side-list li.active .code{color:#D7F0EE;}

  /* ---------- Main content ---------- */
  main{flex:1; padding:28px 36px 60px; max-width:1040px;}
  .crumb{font-size:11px; color:var(--ink-soft); letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px;}
  .crumb b{color:var(--teal);}

  /* Entité header block */
  .header-card{
    background:var(--white);
    border:1px solid var(--chart-line);
    border-left:4px solid var(--teal);
    border-radius:var(--radius);
    padding:18px 22px;
    margin-bottom:26px;
  }
  .header-card h1{
    margin:0 0 4px;
    font-size:22px;
    font-weight:700;
  }
  .header-card .sub{color:var(--ink-soft); font-size:13px; margin-bottom:12px;}
  .tag-row{display:flex; gap:22px; flex-wrap:wrap; font-size:13px;}
  .tag-row .tag b{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:600; margin-bottom:2px;}
  .tag-row .tag span{font-family:'IBM Plex Mono',monospace; font-size:13px;}

  section.block{margin-bottom:30px;}
  section.block > h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--ink-soft);
    font-weight:700;
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  section.block > h2::after{content:""; flex:1; height:1px; background:var(--chart-line);}

  table.data{
    width:100%;
    border-collapse:collapse;
    background:var(--white);
    border:1px solid var(--chart-line);
    font-size:13px;
  }
  table.data th{
    text-align:left;
    background:#EAE3CF;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
    padding:9px 12px;
    border-bottom:1px solid var(--chart-line);
  }
  table.data td{
    padding:9px 12px;
    border-bottom:1px solid var(--chart-line);
    vertical-align:top;
  }
  table.data tr:last-child td{border-bottom:none;}
  table.data tr.clickable{cursor:pointer;}
  table.data tr.clickable:hover td{background:var(--teal-soft);}
  .pill{
    display:inline-block;
    padding:2px 8px;
    border-radius:10px;
    background:var(--teal-soft);
    color:var(--teal);
    font-size:11px;
    font-weight:600;
  }
  .swatch{
    width:34px;height:26px;border:1px solid var(--chart-line);border-radius:2px;
    display:inline-flex;align-items:center;justify-content:center;font-size:15px;background:var(--white);
  }

  /* Symbols page grid */
  .symbol-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:10px;}
  .symbol-card{
    background:var(--white); border:1px solid var(--chart-line); border-radius:var(--radius);
    padding:12px 8px; text-align:center; cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .symbol-card:hover{border-color:var(--teal); transform:translateY(-1px);}
  .symbol-card.active{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber);}
  .symbol-card .glyph{font-size:26px; margin-bottom:6px;}
  .symbol-card .name{font-size:11px; font-weight:600;}

  .symbol-detail{
    background:var(--white); border:1px solid var(--chart-line); border-radius:var(--radius);
    padding:20px; display:flex; gap:22px; align-items:flex-start; margin-top:16px;
  }
  .symbol-detail .glyph-big{
    width:96px;height:96px; flex-shrink:0; background:var(--teal-soft); border:1px solid var(--chart-line);
    display:flex;align-items:center;justify-content:center;font-size:46px; border-radius:4px;
  }
  .symbol-detail .info h3{margin:0 0 4px; font-size:17px;}
  .symbol-detail .info p{margin:0 0 12px; font-size:13px; color:var(--ink-soft); max-width:520px;}

  /* Rules page editable params */
  .param-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .param-field{background:var(--white); border:1px solid var(--chart-line); border-radius:var(--radius); padding:10px 12px;}
  .param-field label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; margin-bottom:5px;}
  .param-field input{
    width:100%; border:1px solid var(--chart-line); border-radius:2px; padding:6px 8px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; background:#FBFAF4;
  }
  .param-field input:focus{outline:none; border-color:var(--teal);}
  .code-preview{
    margin-top:14px; background:var(--navy-deep); color:#CFE3E8; font-family:'IBM Plex Mono',monospace;
    font-size:12.5px; padding:14px 16px; border-radius:var(--radius); line-height:1.6; overflow-x:auto;
  }
  .code-preview .kw{color:#E6A664;}
  .code-preview .var{color:#7FD1C8;}
  .code-preview .str{color:#C7D98A;}
  .save-row{display:flex; justify-content:flex-end; margin-top:12px;}
  .save-row button{
    background:var(--amber); border:none; color:var(--navy-deep); font-weight:700; font-size:12.5px;
    padding:9px 18px; border-radius:2px; cursor:pointer; letter-spacing:.02em;
  }
  .save-row button:hover{background:#DA8B37;}
  .save-msg{font-size:12px; color:var(--teal); align-self:center; margin-right:12px; opacity:0; transition:opacity .2s;}
  .save-msg.show{opacity:1;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#1E3E63; border-radius:4px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>S-101 <small>ANALYSEUR DES RÈGLES D'AFFICHAGE LUA</small></div>
  <nav class="topnav" id="topnav">
    <button data-page="features">Features</button>
    <button data-page="attributes">Attributes</button>
    <button data-page="symbols">Symbols</button>
    <button data-page="rules">Règles</button>
  </nav>
</div>

<div class="shell">
  <aside class="sidebar">
    <input type="text" id="search" placeholder="Rechercher…">
    <div class="label" id="side-label">Features</div>
    <ul class="side-list" id="side-list"></ul>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ---------------- Mock data (Feature Catalogue / Portrayal Catalogue style) ---------------- */
const FEATURES = {
  BOYCAR: {code:"BOYCAR", name:"Bouée cardinale", pseudo:"Cardinal Buoy", primitive:"Point",
    attributes:["CATBOY","COLOUR","OBJNAM"],
    symbols:["SY-BOYCAR01","SY-BOYCAR02"],
    rules:["RUL-BOYCAR-COLOR","RUL-BOYCAR-TOPMARK"]},
  LIGHTS: {code:"LIGHTS", name:"Feu", pseudo:"Light", primitive:"Point",
    attributes:["CATLIT","COLOUR","SIGPER"],
    symbols:["SY-LIGHTS01"],
    rules:["RUL-LIGHTS-SECTOR"]},
  COALNE: {code:"COALNE", name:"Trait de côte", pseudo:"Coastline", primitive:"Ligne",
    attributes:["CATCOA","OBJNAM"],
    symbols:["SY-COALNE01"],
    rules:["RUL-COALNE-LINE"]},
};

const ATTRIBUTES = {
  CATBOY: {code:"CATBOY", name:"Catégorie de bouée", pseudo:"Category of Boy", type:"Enumeration",
    desc:"Classification de la bouée selon le système cardinal ou latéral.",
    dict:[{t:"1", d:"Cardinale Nord"},{t:"2", d:"Cardinale Est"},{t:"3", d:"Cardinale Sud"},{t:"4", d:"Cardinale Ouest"}],
    features:["BOYCAR"]},
  COLOUR: {code:"COLOUR", name:"Couleur", pseudo:"Colour", type:"Enumeration (liste)",
    desc:"Une ou plusieurs couleurs associées à l'objet, utilisées pour déterminer le rendu du symbole.",
    dict:[{t:"1", d:"Noir"},{t:"4", d:"Jaune"},{t:"6", d:"Blanc"}],
    features:["BOYCAR","LIGHTS"]},
  OBJNAM: {code:"OBJNAM", name:"Nom de l'objet", pseudo:"Object Name", type:"Texte libre",
    desc:"Nom donné à l'objet dans la langue nationale.",
    dict:[{t:"—", d:"Chaîne de caractères libre, sans valeurs énumérées."}],
    features:["BOYCAR","COALNE"]},
  CATLIT: {code:"CATLIT", name:"Catégorie de feu", pseudo:"Category of Light", type:"Enumeration",
    desc:"Type de caractéristique lumineuse du feu (fixe, à éclats, etc.).",
    dict:[{t:"1", d:"Feu fixe"},{t:"11", d:"Feu directionnel"},{t:"27", d:"Feu à secteurs"}],
    features:["LIGHTS"]},
  SIGPER: {code:"SIGPER", name:"Période du signal", pseudo:"Signal Period", type:"Nombre réel (s)",
    desc:"Durée, en secondes, d'un cycle complet de la caractéristique lumineuse.",
    dict:[{t:"—", d:"Valeur numérique en secondes, ex. 4.0s"}],
    features:["LIGHTS"]},
  CATCOA: {code:"CATCOA", name:"Catégorie de côte", pseudo:"Category of Coastline", type:"Enumeration",
    desc:"Nature physique du trait de côte représenté.",
    dict:[{t:"1", d:"Falaise"},{t:"6", d:"Plage"}],
    features:["COALNE"]},
};

const SYMBOLS = {
  "SY-BOYCAR01": {id:"SY-BOYCAR01", name:"Bouée cardinale Nord", glyph:"▲▲", desc:"Symbole affiché lorsque CATBOY = 1 (Nord) et COLOUR contient Noir/Jaune.",
    objects:[{feature:"BOYCAR", condition:"CATBOY = 1", rule:"RUL-BOYCAR-TOPMARK"}]},
  "SY-BOYCAR02": {id:"SY-BOYCAR02", name:"Bouée cardinale Sud", glyph:"▼▼", desc:"Symbole affiché lorsque CATBOY = 3 (Sud).",
    objects:[{feature:"BOYCAR", condition:"CATBOY = 3", rule:"RUL-BOYCAR-TOPMARK"}]},
  "SY-LIGHTS01": {id:"SY-LIGHTS01", name:"Secteur de feu", glyph:"☼", desc:"Représentation du secteur lumineux selon SIGPER et COLOUR.",
    objects:[{feature:"LIGHTS", condition:"CATLIT = 27", rule:"RUL-LIGHTS-SECTOR"}]},
  "SY-COALNE01": {id:"SY-COALNE01", name:"Trait de côte relevé", glyph:"⌇⌇", desc:"Ligne pleine utilisée pour un trait de côte de précision connue.",
    objects:[{feature:"COALNE", condition:"CATCOA ≠ NULL", rule:"RUL-COALNE-LINE"}]},
};

const RULES = {
  "RUL-BOYCAR-COLOR": {id:"RUL-BOYCAR-COLOR", name:"Couleur de la bouée cardinale", desc:"Détermine la teinte du symbole selon CATBOY.",
    params:[{k:"seuil_nord", v:"1"},{k:"couleur_haut", v:"noir"}],
    code:["<span class='kw'>if</span> <span class='var'>CATBOY</span> == <span class='str'>1</span> <span class='kw'>then</span>",
          "&nbsp;&nbsp;<span class='var'>colour</span> = <span class='str'>\"NOIR-JAUNE-NOIR\"</span>",
          "<span class='kw'>elseif</span> <span class='var'>CATBOY</span> == <span class='str'>3</span> <span class='kw'>then</span>",
          "&nbsp;&nbsp;<span class='var'>colour</span> = <span class='str'>\"JAUNE-NOIR-JAUNE\"</span>",
          "<span class='kw'>end</span>"],
    features:["BOYCAR"]},
  "RUL-BOYCAR-TOPMARK": {id:"RUL-BOYCAR-TOPMARK", name:"Voyant de la bouée cardinale", desc:"Sélectionne la forme du voyant selon la position cardinale.",
    params:[{k:"forme_nord", v:"2 cônes pointe en haut"}],
    code:["<span class='kw'>if</span> <span class='var'>CATBOY</span> == <span class='str'>1</span> <span class='kw'>then</span>",
          "&nbsp;&nbsp;<span class='var'>topmark</span> = <span class='str'>\"double_cone_up\"</span>",
          "<span class='kw'>end</span>"],
    features:["BOYCAR"]},
  "RUL-LIGHTS-SECTOR": {id:"RUL-LIGHTS-SECTOR", name:"Secteur du feu", desc:"Calcule l'angle et la couleur du secteur affiché.",
    params:[{k:"angle_min", v:"045"},{k:"angle_max", v:"180"}],
    code:["<span class='kw'>local</span> <span class='var'>sector</span> = <span class='var'>SECTR1</span> .. <span class='str'>\"-\"</span> .. <span class='var'>SECTR2</span>",
          "<span class='kw'>if</span> <span class='var'>CATLIT</span> == <span class='str'>27</span> <span class='kw'>then</span>",
          "&nbsp;&nbsp;<span class='var'>drawSector</span>(<span class='var'>sector</span>, <span class='var'>COLOUR</span>)",
          "<span class='kw'>end</span>"],
    features:["LIGHTS"]},
  "RUL-COALNE-LINE": {id:"RUL-COALNE-LINE", name:"Style du trait de côte", desc:"Choisit le style de ligne selon la précision du levé.",
    params:[{k:"epaisseur_px", v:"1.5"}],
    code:["<span class='kw'>if</span> <span class='var'>CATCOA</span> ~= <span class='kw'>nil</span> <span class='kw'>then</span>",
          "&nbsp;&nbsp;<span class='var'>lineStyle</span> = <span class='str'>\"solid\"</span>",
          "<span class='kw'>end</span>"],
    features:["COALNE"]},
};

/* ---------------- App state ---------------- */
const state = { page:"features", selected:{ features:"BOYCAR", attributes:"CATBOY", symbols:"SY-BOYCAR01", rules:"RUL-BOYCAR-COLOR" } };

const PAGE_LABEL = {features:"Features", attributes:"Attributes", symbols:"Symbols", rules:"Règles"};
const PAGE_DATA  = {features:FEATURES, attributes:ATTRIBUTES, symbols:SYMBOLS, rules:RULES};

function go(page, id){
  state.page = page;
  if(id) state.selected[page] = id;
  render();
}

function renderSidebar(){
  document.getElementById('side-label').textContent = PAGE_LABEL[state.page];
  const data = PAGE_DATA[state.page];
  const list = document.getElementById('side-list');
  const filter = (document.getElementById('search').value || "").toLowerCase();
  list.innerHTML = "";
  Object.values(data).forEach(item=>{
    const label = item.name || item.id || item.code;
    const code = item.code || item.id;
    if(filter && !(label.toLowerCase().includes(filter) || code.toLowerCase().includes(filter))) return;
    const li = document.createElement('li');
    li.className = (code === state.selected[state.page]) ? 'active' : '';
    li.innerHTML = `<span>${label}</span><span class="code">${code}</span>`;
    li.onclick = ()=> go(state.page, code);
    list.appendChild(li);
  });
}

function crumb(text){ return `<div class="crumb">Front-End &nbsp;/&nbsp; <b>${text}</b></div>`; }

function renderFeatures(){
  const f = FEATURES[state.selected.features];
  const main = document.getElementById('main');
  main.innerHTML = `
    ${crumb('Features')}
    <div class="header-card">
      <h1>${f.name}</h1>
      <div class="sub">Pseudonyme : ${f.pseudo}</div>
      <div class="tag-row">
        <div class="tag"><b>Code</b><span>${f.code}</span></div>
        <div class="tag"><b>Primitive</b><span>${f.primitive}</span></div>
      </div>
    </div>

    <section class="block">
      <h2>Attributs liés</h2>
      <table class="data">
        <thead><tr><th>Code</th><th>Nom</th><th>Type</th><th>Multiplicité</th></tr></thead>
        <tbody>
          ${f.attributes.map(code=>{
            const a = ATTRIBUTES[code];
            return `<tr class="clickable" onclick="go('attributes','${code}')">
              <td class="mono">${a.code}</td><td>${a.name}</td><td>${a.type}</td><td>0..1</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </section>

    <section class="block">
      <h2>Symboles liés</h2>
      <table class="data">
        <thead><tr><th>Aperçu</th><th>Nom</th><th>Condition</th></tr></thead>
        <tbody>
          ${f.symbols.map(id=>{
            const s = SYMBOLS[id];
            return `<tr class="clickable" onclick="go('symbols','${id}')">
              <td><span class="swatch">${s.glyph}</span></td><td>${s.name}</td>
              <td class="mono">${s.objects[0].condition}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </section>

    <section class="block">
      <h2>Règles liées</h2>
      <table class="data">
        <thead><tr><th>Règle</th><th>Description</th></tr></thead>
        <tbody>
          ${f.rules.map(id=>{
            const r = RULES[id];
            return `<tr class="clickable" onclick="go('rules','${id}')">
              <td class="mono">${r.id}</td><td>${r.name}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </section>
  `;
}

function renderAttributes(){
  const a = ATTRIBUTES[state.selected.attributes];
  const main = document.getElementById('main');
  main.innerHTML = `
    ${crumb('Attributes')}
    <div class="header-card">
      <h1>${a.name}</h1>
      <div class="sub">${a.desc}</div>
      <div class="tag-row">
        <div class="tag"><b>Code</b><span>${a.code}</span></div>
        <div class="tag"><b>Pseudonyme</b><span>${a.pseudo}</span></div>
        <div class="tag"><b>Type</b><span>${a.type}</span></div>
      </div>
    </div>

    <section class="block">
      <h2>Dictionnaire des valeurs</h2>
      <table class="data">
        <thead><tr><th style="width:80px">Valeur</th><th>Définition</th></tr></thead>
        <tbody>
          ${a.dict.map(d=>`<tr><td class="mono">${d.t}</td><td>${d.d}</td></tr>`).join('')}
        </tbody>
      </table>
    </section>

    <section class="block">
      <h2>Objets liés</h2>
      <table class="data">
        <thead><tr><th>Code</th><th>Nom</th><th>Primitive</th></tr></thead>
        <tbody>
          ${a.features.map(code=>{
            const f = FEATURES[code];
            return `<tr class="clickable" onclick="go('features','${code}')">
              <td class="mono">${f.code}</td><td>${f.name}</td><td>${f.primitive}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </section>
  `;
}

function renderSymbols(){
  const s = SYMBOLS[state.selected.symbols];
  const main = document.getElementById('main');
  main.innerHTML = `
    ${crumb('Symbols')}
    <section class="block">
      <h2>Tous les symboles</h2>
      <div class="symbol-grid">
        ${Object.values(SYMBOLS).map(sym=>`
          <div class="symbol-card ${sym.id===s.id?'active':''}" onclick="go('symbols','${sym.id}')">
            <div class="glyph">${sym.glyph}</div>
            <div class="name">${sym.name}</div>
          </div>`).join('')}
      </div>
    </section>

    <section class="block">
      <h2>Détail du symbole sélectionné</h2>
      <div class="symbol-detail">
        <div class="glyph-big">${s.glyph}</div>
        <div class="info">
          <h3>${s.name}</h3>
          <p>${s.desc}</p>
          <table class="data">
            <thead><tr><th>Objet</th><th>Condition</th><th>Règle</th></tr></thead>
            <tbody>
              ${s.objects.map(o=>`
                <tr class="clickable" onclick="go('features','${o.feature}')">
                  <td class="mono">${FEATURES[o.feature].name}</td>
                  <td class="mono">${o.condition}</td>
                  <td class="mono" style="color:var(--teal)" onclick="event.stopPropagation(); go('rules','${o.rule}')">${o.rule}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  `;
}

function renderRules(){
  const r = RULES[state.selected.rules];
  const main = document.getElementById('main');
  main.innerHTML = `
    ${crumb('Règles')}
    <div class="header-card">
      <h1>${r.name}</h1>
      <div class="sub">${r.desc}</div>
      <div class="tag-row"><div class="tag"><b>Identifiant</b><span>${r.id}</span></div></div>
    </div>

    <section class="block">
      <h2>Paramètres modifiables</h2>
      <div class="param-grid">
        ${r.params.map(p=>`
          <div class="param-field">
            <label>${p.k}</label>
            <input type="text" value="${p.v}" oninput="markDirty()">
          </div>`).join('')}
      </div>
      <div class="code-preview">${r.code.join('<br>')}</div>
      <div class="save-row">
        <span class="save-msg" id="save-msg">Modifications enregistrées</span>
        <button onclick="saveParams()">Enregistrer les modifications</button>
      </div>
    </section>

    <section class="block">
      <h2>Objets liés</h2>
      <table class="data">
        <thead><tr><th>Code</th><th>Nom</th><th>Primitive</th></tr></thead>
        <tbody>
          ${r.features.map(code=>{
            const f = FEATURES[code];
            return `<tr class="clickable" onclick="go('features','${code}')">
              <td class="mono">${f.code}</td><td>${f.name}</td><td>${f.primitive}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </section>
  `;
}

function markDirty(){}
function saveParams(){
  const msg = document.getElementById('save-msg');
  msg.classList.add('show');
  setTimeout(()=>msg.classList.remove('show'), 1600);
}

const RENDERERS = {features:renderFeatures, attributes:renderAttributes, symbols:renderSymbols, rules:renderRules};

function render(){
  document.querySelectorAll('#topnav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.page === state.page);
  });
  renderSidebar();
  RENDERERS[state.page]();
}

document.getElementById('topnav').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  go(btn.dataset.page);
});
document.getElementById('search').addEventListener('input', renderSidebar);

render();
</script>
</body>
</html>
